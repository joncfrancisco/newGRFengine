name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the test suite
        run: python -m pytest tests -q

      - name: Build the demo set (renders, writes NML, compiles with nmlc)
        run: python examples/demo/build.py

      - name: Build the bilevel example
        run: python examples/bilevel/build.py

      - name: Audit every generated sheet
        run: python -m newgrfengine check examples/demo/sprites/*.png examples/bilevel/sprites/*.png
